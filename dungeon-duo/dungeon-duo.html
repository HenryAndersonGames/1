    text(Ls.name, px + 20, py + 24, 24, "#fff", "left", FH, true, 3);

    var Df = DIF();
    panel(VW / 2 - 150, 96, 300, 30, Df.col);
    text("Сложность: " + Df.name + "   (X — сменить)", VW / 2, 111, 14, Df.col, "center", FT, true, 2);
    text(save.diff === 0 ? "враги слабее, больше лечения" : save.diff === 2 ? "враги вдвое сильнее, награда ×1.7" : "враги сильнее, награда ×1.3", VW / 2, 138, 12, "#bbb", "center", FT, false, 3);
    text("◄ ► выбор   ·   A — в путь   ·   X — сложность   ·   Y — герои: навыки и оружие   ·   Start — меню", VW / 2, VH - 26, 13, "#bba", "center", FT, false, 3);
  }
  function hy0() { return 22; }

  // ---------- экран героев ----------
  function drawChar() {
    if (players.length) { drawWorld(); ctx.fillStyle = "rgba(6,4,12,0.72)"; ctx.fillRect(0, 0, VW, VH); } else { ctx.fillStyle = "#0b0810"; ctx.fillRect(0, 0, VW, VH); }
    ctx.fillStyle = "rgba(0,0,0,0.35)"; ctx.fillRect(0, 0, VW, VH);
    text("ГЕРОИ", VW / 2, 26, 26, "#ffe39a", "center", FH, true, 4);
    ctx.drawImage(objSprite("coin"), VW / 2 - 50, 44, 16, 16); text(String(save.gold), VW / 2 - 28, 52, 15, "#ffd34d", "left", FT, true, 3);
    var hw = Math.min(560, VW / 2 - 24), hh = VH - 110;
    for (var i = 0; i < 2; i++) {
      var x = i === 0 ? VW / 2 - hw - 10 : VW / 2 + 10, y = 70, h = save.heroes[i], u = charUI[i], C = CLASSES[h.cls], pc = PCOL[i];
      var shk = u.shakeT > 0 ? Math.sin(T * 60) * 4 : 0; if (u.shakeT > 0) u.shakeT -= 1 / 60;
      panel(x + shk, y, hw, hh, pc.C);
      ctx.drawImage(heroSprite(h.cls, i, "idle"), 4, 0, 13, 13, x + 12, y + 8, 44, 44);
      text("P" + (i + 1) + " · " + C.name + " · ур. " + h.lvl, x + 64, y + 22, 16, pc.ui, "left");
      bar(x + 64, y + 36, 180, 6, h.xp / xpNeed(h), "#7cc8ff", "#2d6ab0");
      text("Очки навыков: " + h.sp, x + hw - 14, y + 22, 14, h.sp > 0 ? "#7dff8a" : "#999", "right");
      // вкладки
      var tabs = ["Навыки", "Оружие", "Артефакты"];
      for (var t = 0; t < 3; t++) {
        var tw = (hw - 28) / 3 - 6, tx = x + 14 + t * (tw + 9);
        rr(tx, y + 52, tw, 28, 6); ctx.fillStyle = u.tab === t ? "rgba(255,210,100,0.2)" : "rgba(255,255,255,0.04)"; ctx.fill();
        ctx.strokeStyle = u.tab === t ? "#ffd34d" : "#444"; ctx.lineWidth = 1.5; ctx.stroke();
        text(tabs[t], tx + tw / 2, y + 66, 14, u.tab === t ? "#fff" : "#999", "center");
      }
      if (u.tab === 2) drawArtifacts(x, y + 88, hw, hh - 88, h, u);
      else if (u.tab === 0) drawSkillTree(x, y + 88, hw, hh - 88, h, u, i);
      else if (u.tab === 1) drawArsenal(x, y + 88, hw, hh - 88, h, u, i);
    }
    text("Y — следующая вкладка   ·   B — назад в игру", VW / 2, VH - 18, 13, "#bba", "center", FT, false, 3);
  }

  function drawSkillTree(x, y, w, h, hero, u, pi) {
    var C = CLASSES[hero.cls], colW = (w - 28) / 3, nodeH = Math.min(52, (h - 190) / 4 - 8), i, t;
    for (var br = 0; br < 3; br++) {
      var cx = x + 14 + br * colW + colW / 2;
      text(C.branches[br], cx, y + 8, 13, "#ffe39a", "center", FH, true, 2);
      for (t = 0; t < 4; t++) {
        var id = skillAt(hero.cls, br, t), S = SKILLS[id], r = hero.skills[id] || 0, ny = y + 22 + t * (nodeH + 10), nw = colW - 16;
        if (t > 0) { ctx.strokeStyle = r > 0 ? "#ffd34d" : "#444"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(cx, ny - 10); ctx.lineTo(cx, ny); ctx.stroke(); }
        var avail = canLearn(hero, id), selc = u.col === br && u.row === t;
        rr(cx - nw / 2, ny, nw, nodeH, 6);
        ctx.fillStyle = r > 0 ? (S.type === "a" ? "rgba(90,60,140,0.7)" : "rgba(60,80,60,0.7)") : avail ? "rgba(70,60,40,0.7)" : "rgba(20,18,26,0.85)"; ctx.fill();
        ctx.strokeStyle = selc ? "#fff" : r > 0 ? "#ffd34d" : avail ? "#8a7444" : "#333"; ctx.lineWidth = selc ? 3 : 1.5; ctx.stroke();
        if (S.type === "a") { ctx.strokeStyle = "rgba(200,140,255,0.6)"; ctx.lineWidth = 1; rr(cx - nw / 2 + 3, ny + 3, nw - 6, nodeH - 6, 4); ctx.stroke(); }
        ctx.globalAlpha = r > 0 || avail ? 1 : 0.4;
        skillIcon(id, cx - nw / 2 + 20, ny + nodeH / 2, Math.min(1, nodeH / 44));
        ctx.globalAlpha = 1;
        ctx.save(); ctx.beginPath(); ctx.rect(cx - nw / 2 + 36, ny, nw - 40, nodeH); ctx.clip();
        text(S.name, cx - nw / 2 + 38, ny + nodeH / 2 - 7, 11, r > 0 ? "#fff" : avail ? "#ddd" : "#777", "left");
        ctx.restore();
        for (i = 0; i < S.max; i++) { ctx.fillStyle = i < r ? "#ffd34d" : "#333"; ctx.fillRect(cx - nw / 2 + 38 + i * 12, ny + nodeH / 2 + 6, 9, 5); }
        var si = hero.slots.indexOf(id);
        if (si >= 0) text(si === 0 ? "LB" : "RB", cx + nw / 2 - 6, ny + 9, 10, "#ffd34d", "right", FT, true, 2);
      }
    }
    // описание
    var sid = skillAt(hero.cls, u.col, u.row), SS = SKILLS[sid], rk = hero.skills[sid] || 0, iy = y + 22 + 4 * (nodeH + 10) + 4;
    panel(x + 14, iy, w - 28, h - (iy - y) - 8, "#4a3f66");
    text(SS.name, x + 28, iy + 18, 17, "#fff", "left", FH, true);
    text((SS.type === "a" ? "Умение" : "Пассивный навык") + "  ·  уровень " + rk + "/" + SS.max, x + w - 28, iy + 18, 12, SS.type === "a" ? "#c88cff" : "#9ad", "right");
    var ny2 = wrapText(SS.desc + (SS.type === "a" ? ". Каждый уровень: +35% силы, −10% перезарядки. Перезарядка " + SS.cd + " с." : "."), x + 28, iy + 42, w - 56, 13, "#cfc3ad", 17);
    var msg, mc = "#ffe9a0";
    if (rk >= SS.max) { msg = "Изучено полностью"; mc = "#ffd34d"; }
    else if (canLearn(hero, sid)) msg = "A — изучить (1 очко)";
    else if (hero.sp <= 0) { msg = "Нет очков навыков — получайте уровни в походах"; mc = "#999"; }
    else { msg = "Сначала изучите навык выше в этой ветке"; mc = "#ff9a7a"; }
    text(msg, x + 28, ny2 + 4, 13, mc, "left", FT, true);
    if (SS.type === "a" && rk > 0) text("LB — поставить на кнопку LB   ·   RB — на кнопку RB", x + 28, ny2 + 24, 12, "#c88cff", "left", FT, false);
    text("Кнопки: LB — " + (hero.slots[0] ? SKILLS[hero.slots[0]].name : "—") + "   ·   RB — " + (hero.slots[1] ? SKILLS[hero.slots[1]].name : "—"), x + 28, iy + h - (iy - y) - 26, 12, "#ffd34d", "left", FT, true);
  }

  function drawArsenal(x, y, w, h, hero, u, pi) {
    var list = CLASSES[hero.cls].weapons, rowH = 64, i;
    for (i = 0; i <= list.length; i++) {
      var ry = y + 4 + i * (rowH + 8), selc = u.wsel === i;
      rr(x + 14, ry, w - 28, rowH, 6);
      ctx.fillStyle = selc ? "rgba(255,210,100,0.14)" : "rgba(255,255,255,0.04)"; ctx.fill();
      ctx.strokeStyle = selc ? "#ffd34d" : "#3a3446"; ctx.lineWidth = selc ? 2 : 1; ctx.stroke();
      if (i < list.length) {
        var wid = list[i], W = WEAPONS[wid], lv = hero.weapons[wid] || 0, eq = hero.weapon === wid;
        drawWeapon({ ang: 0, face: 1, swingT: 0, spinT: 0, atkCd: 1, castT: 0, thrustT: 0 }, wid, Math.max(1, lv), x + 34, ry + rowH / 2 + (wid === "fire" || wid === "ice" || wid === "storm" ? 14 : 0), 2.2);
        text(W.name + (lv ? "  +" + lv : ""), x + 110, ry + 16, 15, lv ? "#fff" : "#aaa", "left");
        text(W.desc, x + 110, ry + 34, 11, "#bbb", "left", FT, false);
        text("LT: " + W.skill + " — " + W.sdesc, x + 110, ry + 50, 11, "#c88cff", "left", FT, false);
        var st = eq ? "ЭКИПИРОВАНО" : lv ? "куплено" : W.price + " зол.";
        text(st, x + w - 26, ry + 16, 12, eq ? "#7dff8a" : lv ? "#9ad" : save.gold >= W.price ? "#ffd34d" : "#a55", "right");
      } else {
        iconShield(x + 40, ry + rowH / 2, 1.8);
        text("Броня  уровень " + hero.arl, x + 110, ry + 18, 15, "#fff", "left");
        text("+20 здоровья и +5% защиты за уровень", x + 110, ry + 38, 11, "#bbb", "left", FT, false);
        text(hero.arl >= 10 ? "макс." : aCost(hero) + " зол.", x + w - 26, ry + 18, 12, save.gold >= aCost(hero) ? "#ffd34d" : "#a55", "right");
      }
    }
    var iy = y + 4 + (list.length + 1) * (rowH + 8) + 4, msg = "", msg2 = "";
    if (u.wsel < list.length) {
      var w2 = list[u.wsel], lv2 = hero.weapons[w2] || 0;
      if (!lv2) msg = "A — купить за " + WEAPONS[w2].price + " золота";
      else { msg = hero.weapon === w2 ? "Это оружие в руках" : "A — взять это оружие"; msg2 = lv2 >= 10 ? "Уровень оружия максимальный" : "X — улучшить до +" + (lv2 + 1) + " за " + 30 * lv2 + " золота"; }
    } else { msg = hero.arl >= 10 ? "Броня максимальная" : "A — улучшить броню за " + aCost(hero) + " золота"; }
    text(msg, x + 28, iy + 12, 13, "#ffe9a0", "left", FT, true);
    if (msg2) text(msg2, x + 28, iy + 32, 13, "#ffe9a0", "left", FT, true);
    text("Особенности: с +4 оружие золотое и сильнее, с +7 — кристальное.", x + 28, iy + 54, 11, "#999", "left", FT, false);
  }

  function overlayScreen(title, color, lines) {
    ctx.fillStyle = "rgba(6,4,12,0.8)"; ctx.fillRect(0, 0, VW, VH);
    text(title, VW / 2, VH * 0.32, 52, color, "center", FH, true, 6);
    for (var i = 0; i < lines.length; i++) text(lines[i].t, VW / 2, VH * 0.32 + 70 + i * 34, lines[i].s || 18, lines[i].c || "#ddd", "center", FT, !!lines[i].b, 3);
  }

  function render() {
    ctx.imageSmoothingEnabled = false;
    if (state === "title") drawTitleScreen();
    else if (state === "select") drawSelect();
    else if (state === "hub") drawHub();
    else if (state === "char") drawChar();
    else {
      drawWorld();
      if (state === "map") drawMapOverlay();
      if (state === "pause") {
        var pit = pauseItems(), lines = [];
        for (var pi2 = 0; pi2 < pit.length; pi2++) lines.push({ t: (pauseSel === pi2 ? "► " : "") + pit[pi2], b: pauseSel === pi2, c: pauseSel === pi2 ? "#fff" : "#999", s: 19 });
        lines.push({ t: "" });
        lines.push({ t: "A — лёгкая атака · X — тяжёлая (удерживать — заряд) · A,X / A,A,X — комбо", s: 13 });
        lines.push({ t: "B — рывок (удерживать — бег) · LB / RB — умения · LT — приём оружия · RT — суперудар", s: 13 });
        lines.push({ t: "Y — взаимодействие · Back — карта мира · Start — пауза", s: 13 });
        overlayScreen("ПАУЗА", "#fff", lines);
      }
      if (state === "over") overlayScreen("ГЕРОИ ПАЛИ", "#ff5a64", [
        { t: "Опыт сохранён. Потеряна половина золота этого похода: " + (victoryInfo ? victoryInfo.lost : 0), c: "#ddd" },
        { t: "Совет: потратьте очки навыков и улучшите снаряжение в палатке героев", c: "#ffe9a0", s: 15 },
        { t: "" }, { t: victoryInfo && victoryInfo.world ? "A / Пробел — вернуться в лагерь" : "A / Пробел — выйти из подземелья", b: true, s: 20 }]);
      if (state === "victory") {
        var vi = victoryInfo;
        overlayScreen(vi.final ? "ПОБЕДА!" : "ЛОКАЦИЯ ПРОЙДЕНА!", "#ffd34d", [
          { t: vi.final ? "Повелитель Тьмы повержен — королевство спасено!" : LOCS[vi.loc].name + " очищены от зла", c: "#fff", s: 20, b: true },
          { t: "Награда: " + vi.reward + " золота", c: "#ffd34d" },
          { t: !vi.final && vi.first ? "Открыта новая локация: " + LOCS[vi.loc + 1].name : vi.final ? "Можно перепроходить любые локации" : "", c: "#7dff8a" },
          { t: BOSS_ART[LOCS[vi.loc].boss] && save.arts.indexOf(BOSS_ART[LOCS[vi.loc].boss]) >= 0 ? "Артефакт босса: " + ARTS[BOSS_ART[LOCS[vi.loc].boss]].name : "", c: "#e0b0ff" },
          { t: "" }, { t: "A / Пробел — вернуться в мир", b: true, s: 20 }]);
      }
    }
    if (fade > 0) { ctx.fillStyle = "rgba(0,0,0," + fade + ")"; ctx.fillRect(0, 0, VW, VH); }
  }

  // =====================================================================
  //  ЦИКЛ
  // =====================================================================
  var last = 0;
  function loop(ts) {
    var dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
    pollPads();
    try { update(dt); render(); } catch (err) { if (window.console) console.error(err); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  window.__dd = function () { return { players: players, enemies: enemies, state: state, save: save, floor: floorNum, loc: curLoc, stairs: stairs, portal: portal, anvil: anvil, spawn: spawnEnemy, startLocation: startLocation, toHub: toHub, enterWorld: enterWorld, campSpawn: campSpawn, world: function () { return world; }, trial: function () { return trial; }, startTrial: startTrial, inWorld: function () { return inWorld; } }; };
})();
