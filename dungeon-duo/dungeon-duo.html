    image-rendering: pixelated; image-rendering: crisp-edges; }

<body>
<canvas id="c" width="960" height="640"></canvas>
<script>
(function () {
  "use strict";

  //  БАЗА
  // =====================================================================

  var light = mk(VW, VH), lctx = light.getContext("2d");
  var mapCv = mk(MW * TILE, MH * TILE), mctx = mapCv.getContext("2d");
  var mini = mk(MW * 2, MH * 2), nctx = mini.getContext("2d");

  function fit() {
    var s = Math.min(window.innerWidth / VW, window.innerHeight / VH);
    cv.style.width = Math.floor(VW * s) + "px"; cv.style.height = Math.floor(VH * s) + "px";
  }
  window.addEventListener("resize", fit); fit();

  function rnd(a, b) { return a + Math.random() * (b - a); }
  function irnd(a, b) { return Math.floor(rnd(a, b + 1)); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function dist(a, b) { var dx = a.x - b.x, dy = a.y - b.y; return Math.sqrt(dx * dx + dy * dy); }
  function angDiff(a, b) { var d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return Math.abs(d); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  // =====================================================================
  //  ЗВУК
  // =====================================================================
  var audio = null;
  function initAudio() {
    try {
      if (!audio) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) audio = new AC(); }
      if (audio && audio.state === "suspended") audio.resume();
    } catch (e) {}
  }
  function sfx(freq, dur, type, vol, slide, delay) {
    if (!audio) return;
    try {
      var t = audio.currentTime + (delay || 0), o = audio.createOscillator(), g = audio.createGain();
      o.type = type || "square"; o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol || 0.05, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + dur + 0.03);
    } catch (e) {}
  }
  function noise(dur, vol, hp) {
    if (!audio) return;
    try {
      var n = Math.floor(audio.sampleRate * dur), buf = audio.createBuffer(1, n, audio.sampleRate), d = buf.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      var s = audio.createBufferSource(), g = audio.createGain(), f = audio.createBiquadFilter();
      f.type = "lowpass"; f.frequency.value = hp || 1200;
      s.buffer = buf; g.gain.value = vol || 0.1; s.connect(f); f.connect(g); g.connect(audio.destination); s.start();
    } catch (e) {}
  }
  window.addEventListener("mousedown", initAudio);

  // =====================================================================
  //  ПИКСЕЛЬНЫЕ СПРАЙТЫ
  // =====================================================================
  var PAL = {
    o: "#1b1424", k: "#f1c49b", K: "#c98f6a", w: "#ffffff", s: "#c5cfdb", S: "#7d8a9e", h: "#f4f8ff",
    g: "#f2c14e", G: "#b5832a", b: "#7a4b2a", B: "#4b2c1a", n: "#5b8c3a", N: "#3b5e26", p: "#7b4fc9", P: "#4e2f8a",
    r: "#e0443c", R: "#8e2424", y: "#e8e0c8", Y: "#b0a688", m: "#2a1418", z: "#6ee06e", Z: "#2f9a4a", q: "#c8ffc0",
    t: "#fff6dc", u: "#7fae4f", U: "#4f7a2d", a: "#5a4680", A: "#2f2448", i: "#ff4f6a", v: "#9a98a6", V: "#5d5b69",
    H: "#e8e0c8", J: "#b0a688", M: "#3a2a55", Q: "#22183a", c: "#3d8bff", C: "#1f4fa8", L: "#555", F: "#4b2c1a", l: "#9ff3ff"
  };
  function buildSprite(rows, pal, solid) {
    var h = rows.length, w = 0, x, y;
    for (y = 0; y < h; y++) w = Math.max(w, rows[y].length);
    var c = mk(w, h), g = c.getContext("2d");
    for (y = 0; y < h; y++) for (x = 0; x < rows[y].length; x++) {
      var ch = rows[y].charAt(x);
      if (ch === "." || ch === " ") continue;
      g.fillStyle = solid || (pal && pal[ch]) || PAL[ch] || "#f0f";
      g.fillRect(x, y, 1, 1);
    }
    return c;
  }
  function mirror(rows) { return rows.map(function (r) { return r + r.split("").reverse().join(""); }); }

  var LEGS = {
    idle: ["....oLLooLLo....", "....oLLooLLo....", "....oFFFoFFFo..."],
    a:    ["...oLLo..oLLo...", "..oLLo....oLLo..", "..oFFFo...oFFFo."],
    b:    [".....oLLLLo.....", ".....oLLoLo.....", "....oFFFFFFo...."]
  };
  var BODY = {
    knight: [
      "......oooo......", ".....occcco.....", "....oohhssoo....", "...ohssssssSo...", "...osSoooooSo...",
      "...osokkkkoko...", "...osokkkkkko...", "....ooKkkkKo....", "...occsssssSco..", "..occshhsssSCco.",
      "..oCcsssgsSSCco.", "..oCoSSSgSSSoCo.", "....oBBBgBBBo..."],
    ranger: [
      "......oooo......", ".....occcco.....", "....occcccco....", "...occcCCCCco...", "...occCkkkkCo...",
      "...occkkkkoko...", "...oCckkkkkko...", "....oCCKkkKo....", "...onnCCCCCno...", "..onnnnbnnnnNo..",
      "..oNnnnnbnnNNo..", "..oNNnnnnbNNNo..", "....oBBgBBBBo..."],
    mage: [
      ".........oo.....", "........occo....", ".......occCo....", "......occcCo....", ".....occcccCo...",
      "...oogggggggoo..", "....okkkkkoko...", "....okkkkkkko...", "....owwwkkwwo...", "...occwwwwwCco..",
      "..occcwwwwwCCco.", "..oCcccwwwcCCco.", "..oCCcgggggCCCo."],
    skel: [
      "................", ".....oooooo.....", "....oyyyyyyo....", "...oyyyyyyyyo...", "...oyyoryyorYo..",
      "...oyyooyyooyo..", "...oYyyyyyyyYo..", "....oYoyoyoYo...", ".....ooooooo....", "....oyoyyyoyo...",
      "...oyoyoyoyoyo..", "....oyoyyyoyo...", ".....oyyyyyo...."],
    gob: [
      "................", ".....oooooo.....", "....obbbbbbo....", "oo.obbBBBBbbo.oo", "ouooBuuuuuuBoouo",
      ".ouuuuuuuuuuuuo.", "..oouuruuuruoo..", "....ouuuuuuuo...", "....oUuttuuUo...", "...obbbbbbbbbo..",
      "...oBbbgbbbbBo..", "...oBbbbbbbbBo..", "....oBBBBBBBo..."],
    orc: [
      ".....oooooo.....", "....ouuuuuuo....", "...ouuuuuuuuo...", "...ouUUouUUuo...", "...ouuruuuruo...",
      "...ouuuuuuuuo...", "...oUtUmmmUtUo..", "..ooUUUUUUUUUoo.", ".ouuoVVvvvVVouuo", ".ouuoVvvvvvVouuo",
      ".oUUoVVvvvVVoUUo", ".oUUooBBgBBooUUo", "..oo.oBBBBBo.oo."]
  };
  var SPR_ROWS = {
    slime: [
      "......oooo......", "....ooqqzzoo....", "...oqqzzzzzzo...", "..oqzzzzzzzzzo..", "..ozzzozzzozzo..",
      "..ozzzozzzozzo..", ".ozzzzzzzzzzzZo.", ".ozzzzzzzzzzZZo.", ".oZzzzzzzzzZZZo.", "..oZZZZZZZZZZo..", "...oooooooooo..."],
    bat1: ["..oo........oo..", ".oaao......oaao.", ".oaaao.oo.oaaao.", "..oaaaoaaoaaao..", "...oaaaaaaaao...",
      "....oaiaaiao....", ".....oaaaao.....", "......oooo......"],
    bat2: ["................", "......oooo......", ".....oaaaao.....", "..oooaiaaiaooo..", ".oaaaaaaaaaaaao.",
      "oaaao.oaao.oaaao", "oao..........oao", "oo............oo"],
    boss: mirror([
      "........o..o", ".......ogoog", ".......ogggg", ".......oGgrg", "......oooooo", ".....oHHHHHH",
      "....oHHHHHHH", "....oHooooHH", "....oHoiioHH", "....oHHooHHH", ".....oJHHHHH", "......oJoHoH",
      "...ooooooooo", "..oMMMMMMogo", ".oMMMMMMMMog", "oMMQMMMMMMMo", "oMQQMMMMMMMM", "oHoQQMMMMgMM",
      "oHoQQMMMMgMM", ".o.oQQMMMgMM", "...oQQMMMgMM", "...oQQQMMMMM", "...oooQQQQQQ", "....oooooooo"]),
    chest: [".oooooooooooo.", "obbbbbbbbbbbbo", "obBbbbbbbbbBbo", "oggggggggggggo", "oBbbbbogobbbBo",
      "oBbbbbogobbbBo", "oBBbbbbbbbbBBo", "oggggggggggggo", "oBBBBBBBBBBBBo", ".oooooooooooo."],
    chestOpen: [".oooooooooooo.", "obBBBBBBBBBBbo", "oggggggggggggo", "omgmmmgmmmgmmo", "oBbbbbbbbbbbBo",
      "oBbbbbbbbbbbBo", "oBBbbbbbbbbBBo", "oggggggggggggo", "oBBBBBBBBBBBBo", ".oooooooooooo."],
    barrel: ["..oooooo..", ".obbbbbbo.", "oVVVVVVVVo", "obbBbbBbbo", "obbBbbBbbo", "oVVVVVVVVo",
      "obbBbbBbbo", "obbBbbBbbo", "oVVVVVVVVo", ".obbbbbbo.", "..oooooo.."],
    potion: ["...oo...", "..oBBo..", "...oo...", "..oyyo..", ".orrwro.", "orrrrrro", "orrrrrro", "oRrrrrRo", ".oRRRRo.", "..oooo.."],
    coin: [".oooo.", "ogwggo", "oggggo", "oggGGo", "oGGGGo", ".oooo."],
    anvil: ["oooooooooooooo..", "ohhhhhhhhhhhhhoo", "ovvvvvvvvvvvvvvo", ".oVVVVVVVVVVVoo.", "....ovvvvvvo....",
      "....oVVvvVVo....", "...ovvvvvvvvo...", "..ovvvvvvvvvvo..", "..oVVVVVVVVVVo..", "..oooooooooooo.."],
    sword: ["....o...........", "....go.ooooooo..", "oBBBgoshhhhhhhso", "....go.oSSSSSoo.", "....o..........."]
  };

  var PCOL = [{ c: "#3d8bff", C: "#1f4fa8", ui: "#5aa6ff" }, { c: "#ff8a2b", C: "#b04a12", ui: "#ffa04d" }];
  var CLASSES = [
    { id: "knight", name: "Рыцарь", hp: 140, spd: 150, armor: 0.12, weapon: "sword", L: "#6d7a8e", F: "#4b2c1a",
      stats: [5, 2, 4, 1], desc: ["Крепкий воин ближнего боя.", "Серия из трёх ударов мечом,", "третий удар — мощный."],
      abil: "Вихрь", abilDesc: "кружится и рубит всех вокруг", cd: 7.5 },
    { id: "ranger", name: "Следопыт", hp: 100, spd: 178, armor: 0.04, weapon: "bow", L: "#3b5e26", F: "#4b2c1a",
      stats: [3, 5, 3, 5], desc: ["Быстрый стрелок из лука.", "Стрелы иногда наносят", "двойной (критический) урон."],
      abil: "Залп", abilDesc: "веер из множества стрел", cd: 6 },
    { id: "mage", name: "Маг", hp: 92, spd: 160, armor: 0, weapon: "staff", L: null, F: "#4b2c1a",
      stats: [2, 3, 5, 4], desc: ["Повелитель магии.", "Магические сферы взрываются", "и ранят врагов вокруг."],
      abil: "Ледяная звезда", abilDesc: "урон и заморозка вокруг", cd: 8 }
  ];

  var sprCache = {};
  function heroSprite(cls, pi, frame, solid) {
    var key = cls + "_" + pi + "_" + frame + "_" + (solid || "");
    if (sprCache[key]) return sprCache[key];
    var C = CLASSES[cls], pc = PCOL[pi];
    var pal = { c: pc.c, C: pc.C, L: C.L || pc.C, F: C.F };
    return (sprCache[key] = buildSprite(BODY[C.id].concat(LEGS[frame]), pal, solid));
  }
  var ENEMY_PAL = {
    skel: { L: "#e8e0c8", F: "#b0a688" }, gob: { L: "#4b2c1a", F: "#4f7a2d" }, orc: { L: "#4b2c1a", F: "#5d5b69" }
  };
  var BOSS_PAL = {
    king: { H: "#e8e0c8", J: "#b0a688", M: "#3a2a55", Q: "#22183a", i: "#7dfcff" },
    demon: { H: "#d94a3a", J: "#8e2424", M: "#2a1a1a", Q: "#140c0c", i: "#ffe14f", g: "#ff9a2a", G: "#b0501a" }
  };
  function enemySprite(type, frame, solid, variant) {
    var key = type + "_" + frame + "_" + (solid || "") + "_" + (variant || "");
    if (sprCache[key]) return sprCache[key];
    var rows;
    if (BODY[type]) rows = BODY[type].concat(LEGS[frame]);
    else if (type === "bat") rows = SPR_ROWS[frame === "b" ? "bat2" : "bat1"];
    else rows = SPR_ROWS[type];
    var pal = type === "boss" ? BOSS_PAL[variant] : ENEMY_PAL[type];
    return (sprCache[key] = buildSprite(rows, pal, solid));
  }
  function objSprite(name, pal) {
    var key = "obj_" + name + (pal ? JSON.stringify(pal) : "");
    if (!sprCache[key]) sprCache[key] = buildSprite(SPR_ROWS[name], pal);
    return sprCache[key];
  }
  var SWORD_TIERS = [null, { s: "#ffd970", S: "#c99a2e", h: "#fff3c0" }, { s: "#8ff3ff", S: "#3fb6d6", h: "#e8ffff" }];
  var WEAPON_COLORS = [["#8a5a2b", "#c56cff"], ["#e3b341", "#ffd34d"], ["#5fd6f0", "#8ff3ff"]];

  // рисуем спрайт: (x, y) — середина нижнего края
  function drawSpr(img, x, y, sc, flip, sx, sy) {
    var w = img.width * sc * (sx || 1), h = img.height * sc * (sy || 1);
    ctx.save(); ctx.translate(Math.round(x), Math.round(y)); if (flip) ctx.scale(-1, 1);
    ctx.drawImage(img, -w / 2, -h, w, h); ctx.restore();
  }

  // =====================================================================
  //  УПРАВЛЕНИЕ
  // =====================================================================
  var keys = {};
  window.addEventListener("keydown", function (e) {
    keys[e.keyCode] = true; initAudio();
    if ([32, 37, 38, 39, 40, 13, 9, 16].indexOf(e.keyCode) >= 0) e.preventDefault();
  });
  window.addEventListener("keyup", function (e) { keys[e.keyCode] = false; });
  window.addEventListener("blur", function () { keys = {}; });

  var KEYMAP = [
    { u: [87], d: [83], l: [65], r: [68], atk: [70, 32], dash: [71, 16], spec: [81, 82], act: [69], start: [27] },
    { u: [38], d: [40], l: [37], r: [39], atk: [75, 97], dash: [76, 98], spec: [74, 99], act: [73, 96], start: [13, 80] }
  ];
  function kd(list) { for (var i = 0; i < list.length; i++) if (keys[list[i]]) return true; return false; }
  function pbtn(p, n) { var b = p.buttons[n]; return !!b && (b.pressed || b.value > 0.5); }

  var pads = [], prevHeld = [{}, {}];
  function pollPads() {
    pads = [];
    var list = [];
    try { list = navigator.getGamepads ? navigator.getGamepads() : []; } catch (e) {}
    for (var i = 0; i < list.length; i++) if (list[i] && list[i].connected !== false) pads.push(list[i]);
  }

  function readInput(i) {
    var k = KEYMAP[i], inp = { mx: 0, my: 0, ax: 0, ay: 0, aim: false };
    var held = { atk: kd(k.atk), dash: kd(k.dash), spec: kd(k.spec), act: kd(k.act), start: kd(k.start),
      conf: kd(k.atk), back: kd(k.dash), up: kd(k.u), down: kd(k.d), left: kd(k.l), right: kd(k.r) };
    if (kd(k.l)) inp.mx -= 1; if (kd(k.r)) inp.mx += 1;
    if (kd(k.u)) inp.my -= 1; if (kd(k.d)) inp.my += 1;
    var p = pads[i];
    if (p) {
      var x = p.axes[0] || 0, y = p.axes[1] || 0;
      if (x * x + y * y > 0.06) { inp.mx += x; inp.my += y; }
      if (pbtn(p, 14)) { inp.mx -= 1; held.left = true; } if (pbtn(p, 15)) { inp.mx += 1; held.right = true; }
      if (pbtn(p, 12)) { inp.my -= 1; held.up = true; } if (pbtn(p, 13)) { inp.my += 1; held.down = true; }
      if (x < -0.6) held.left = true; if (x > 0.6) held.right = true;
      if (y < -0.6) held.up = true; if (y > 0.6) held.down = true;
      var rx = p.axes[2] || 0, ry = p.axes[3] || 0;
      if (rx * rx + ry * ry > 0.16) { inp.ax = rx; inp.ay = ry; inp.aim = true; }
      if (pbtn(p, 0)) { held.atk = true; held.conf = true; }
      if (pbtn(p, 7)) held.atk = true;
      if (pbtn(p, 1)) { held.dash = true; held.back = true; }
      if (pbtn(p, 6) || pbtn(p, 5)) held.dash = true;
      if (pbtn(p, 2) || pbtn(p, 4)) held.spec = true;
      if (pbtn(p, 3)) held.act = true;
      if (pbtn(p, 9) || pbtn(p, 8)) held.start = true;
      if (held.atk || held.dash || held.act || held.start) initAudio();
    }
    var m = Math.sqrt(inp.mx * inp.mx + inp.my * inp.my);
    if (m > 1) { inp.mx /= m; inp.my /= m; }
    inp.held = held; inp.e = {};
    for (var key in held) inp.e[key] = held[key] && !prevHeld[i][key];
    prevHeld[i] = held;
    return inp;
  }

  // =====================================================================
  //  КАРТА
  // =====================================================================
  var map, rooms, stairs, anvil, torches, props, chests, explored, floorNum = 1;
  function setF(x, y) { if (x > 0 && y > 0 && x < MW - 1 && y < MH - 1) map[y * MW + x] = 1; }
  function isFloor(tx, ty) { return tx >= 0 && ty >= 0 && tx < MW && ty < MH && map[ty * MW + tx] === 1; }
  function solidAt(px, py) { return !isFloor(Math.floor(px / TILE), Math.floor(py / TILE)); }
  function hitsWall(x, y, r) {
    for (var ox = -1; ox <= 1; ox++) for (var oy = -1; oy <= 1; oy++)
      if ((ox || oy) && solidAt(x + ox * r, y + oy * r * 0.8)) return true;
    return false;
  }
  function moveEnt(e, dx, dy) {
    var ok = true;
    if (!hitsWall(e.x + dx, e.y, e.r)) e.x += dx; else ok = false;
    if (!hitsWall(e.x, e.y + dy, e.r)) e.y += dy; else ok = false;
    return ok;
  }
  function roomCenter(r) { return { x: (r.x + r.w / 2) * TILE, y: (r.y + r.h / 2) * TILE }; }

  function corridor(a, b) {
    var ca = { x: Math.floor(a.x + a.w / 2), y: Math.floor(a.y + a.h / 2) };
    var cb = { x: Math.floor(b.x + b.w / 2), y: Math.floor(b.y + b.h / 2) };
    var x, y, d, hFirst = Math.random() < 0.5;
    var cx = hFirst ? cb.x : ca.x, cy = hFirst ? ca.y : cb.y;
    for (x = Math.min(ca.x, cb.x); x <= Math.max(ca.x, cb.x); x++) for (d = -1; d <= 1; d++) setF(x, cy + d);
    for (y = Math.min(ca.y, cb.y); y <= Math.max(ca.y, cb.y); y++) for (d = -1; d <= 1; d++) setF(cx + d, y);
  }

  function generate() {
    map = new Uint8Array(MW * MH); rooms = []; torches = []; props = []; chests = [];
    explored = new Uint8Array(MW * MH);
    var target = Math.min(13, 7 + floorNum), tries = 0, i, k;
    while (rooms.length < target && tries++ < 900) {
      var w = irnd(8, 14), h = irnd(6, 10);
      var r = { x: irnd(2, MW - w - 3), y: irnd(3, MH - h - 3), w: w, h: h };
      var ok = true;
      for (i = 0; i < rooms.length; i++) {
        var o = rooms[i];
        if (r.x < o.x + o.w + 3 && r.x + r.w + 3 > o.x && r.y < o.y + o.h + 4 && r.y + r.h + 4 > o.y) { ok = false; break; }
      }
      if (ok) rooms.push(r);
    }
    for (k = 0; k < rooms.length; k++) {
      var rr = rooms[k];
      for (var yy = rr.y; yy < rr.y + rr.h; yy++) for (var xx = rr.x; xx < rr.x + rr.w; xx++) setF(xx, yy);
    }
    for (k = 1; k < rooms.length; k++) {
      var best = 0, bd = 1e9;
      for (var j = 0; j < k; j++) { var dd = dist(roomCenter(rooms[k]), roomCenter(rooms[j])); if (dd < bd) { bd = dd; best = j; } }
      corridor(rooms[k], rooms[best]);
    }
    if (rooms.length > 3) corridor(rooms[irnd(1, rooms.length - 1)], rooms[irnd(1, rooms.length - 1)]);

    var start = roomCenter(rooms[0]), far = 1, fd = 0;
    for (k = 1; k < rooms.length; k++) { var d2 = dist(start, roomCenter(rooms[k])); if (d2 > fd) { fd = d2; far = k; } }
    rooms[0].start = true; rooms[far].exit = true;
    stairs = roomCenter(rooms[far]);
    anvil = { x: start.x, y: (rooms[0].y + 1.4) * TILE };

    // факелы на верхних стенах комнат
    for (k = 0; k < rooms.length; k++) {
      var rm = rooms[k], ty = rm.y - 1;
      for (var tx = rm.x + 1; tx < rm.x + rm.w - 1; tx += 4)
        if (!isFloor(tx, ty) && isFloor(tx, ty + 1)) torches.push({ x: tx * TILE + 16, y: ty * TILE + 14, ph: Math.random() * 10 });
    }
    // бочки и сундуки
    for (k = 1; k < rooms.length; k++) {
      var room = rooms[k], nb = irnd(0, 3);
      for (i = 0; i < nb; i++) {
        var side = irnd(0, 3), px, py;

    var stx = Math.floor(stairs.x / TILE), sty = Math.floor(stairs.y / TILE);
    if (explored[sty * MW + stx]) { ctx.fillStyle = "#ffe14f"; ctx.fillRect(mx + 6 + stx * 2 - 2, my + 7 + sty * 2 - 2, 5, 5); }
    for (j = 0; j < chests.length; j++) { var cx = Math.floor(chests[j].x / TILE), cy = Math.floor(chests[j].y / TILE); if (!chests[j].open && explored[cy * MW + cx]) { ctx.fillStyle = "#ffb03a"; ctx.fillRect(mx + 6 + cx * 2 - 1, my + 7 + cy * 2 - 1, 3, 3); } }
    for (j = 0; j < enemies.length; j++) if (enemies[j].type === "boss" && enemies[j].awake) { ctx.fillStyle = "#ff3a3a"; ctx.fillRect(mx + 6 + enemies[j].x / TILE * 2 - 2, my + 7 + enemies[j].y / TILE * 2 - 2, 5, 5); }
    for (j = 0; j < players.length; j++) { ctx.fillStyle = PCOL[j].c; ctx.fillRect(mx + 6 + players[j].x / TILE * 2 - 2, my + 7 + players[j].y / TILE * 2 - 2, 4, 4); }
    ctx.restore();
  }

  function drawShop(p) {
    var w = 300, h = 236, x = p.id === 0 ? 12 : VW - w - 12, y = 112, pc = PCOL[p.id];
    var shk = p.shop.shakeT > 0 ? Math.sin(T * 60) * 4 : 0;
    panel(x + shk, y, w, h, "#c99a3e");
    text("КУЗНЯ", x + w / 2 + shk, y + 22, 20, "#ffd34d", "center", FH, true, 3);
    text(CLASSES[p.cls].name + " (P" + (p.id + 1) + ")", x + w / 2 + shk, y + 42, 12, pc.ui, "center", FT, false);
    for (var i = 0; i < SHOP_ITEMS.length; i++) {
      var it = SHOP_ITEMS[i], ry = y + 56 + i * 38, selc = p.shop.sel === i, cost = shopCost(p, it.id);
      if (selc) { rr(x + 10, ry, w - 20, 34, 5); ctx.fillStyle = "rgba(255,210,100,0.16)"; ctx.fill(); ctx.strokeStyle = "#ffd34d"; ctx.lineWidth = 1.5; ctx.stroke(); }
      var ix = x + 30, iy = ry + 17;
      if (it.id === "wl") iconSword(ix, iy, 1.3); else if (it.id === "arl") iconShield(ix, iy, 1.2); else if (it.id === "al") iconStar(ix, iy, 1.2); else iconPotion(ix, iy, 2);
      var maxed = it.id !== "pot" && p[it.id] >= 10;
      var lvTxt = it.id === "pot" ? "" : (maxed ? "  макс." : "  " + p[it.id] + " → " + (p[it.id] + 1));
      text(it.name + lvTxt, x + 50, ry + 12, 14, selc ? "#fff" : "#ccc");
      text(it.info, x + 50, ry + 26, 11, "#999", "left", FT, false);
      if (!maxed) { ctx.drawImage(objSprite("coin"), x + w - 72, ry + 10, 12, 12); text(String(cost), x + w - 56, ry + 17, 14, gold >= cost ? "#ffd34d" : "#a55", "left"); }
    }
    text("A — купить   ·   B — выйти   ·   ↑↓ — выбор", x + w / 2, y + h - 14, 12, "#aaa", "center", FT, false);
  }

  function drawTitle(y) {
    var g = ctx.createLinearGradient(0, y - 30, 0, y + 20);
    g.addColorStop(0, "#fff3c0"); g.addColorStop(0.5, "#ffc94a"); g.addColorStop(1, "#c07a1a");
    ctx.font = "bold 50px " + FH; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.lineWidth = 8; ctx.strokeStyle = "#1b0e08"; ctx.lineJoin = "round"; ctx.strokeText("ПОДЗЕМЕЛЬЕ НА ДВОИХ", VW / 2, y);
    ctx.fillStyle = g; ctx.fillText("ПОДЗЕМЕЛЬЕ НА ДВОИХ", VW / 2, y);
  }

  var menuBg = null;
  function drawSelect() {
    if (!menuBg) { floorNum = 1; generate(); menuBg = roomCenter(rooms[0]); }
    ctx.imageSmoothingEnabled = false;
    var ox = menuBg.x - VW / 2 + Math.sin(T * 0.15) * 200, oy = menuBg.y - VH / 2 + Math.cos(T * 0.11) * 100;
    ox = clamp(ox, 0, mapCv.width - VW); oy = clamp(oy, 0, mapCv.height - VH);
    ctx.drawImage(mapCv, ox, oy, VW, VH, 0, 0, VW, VH);
    for (var t = 0; t < torches.length; t++) drawTorch(torches[t], ox, oy);
    ctx.fillStyle = "rgba(6,4,12,0.72)"; ctx.fillRect(0, 0, VW, VH);
    ctx.drawImage(vignette, 0, 0);
    updateParticles(1 / 60);
    for (var q = 0; q < parts.length; q++) { var pp = parts[q]; ctx.globalAlpha = Math.max(0, pp.life / pp.max); ctx.fillStyle = pp.color; ctx.fillRect(pp.x - ox, pp.y - oy, 2, 2); }
    ctx.globalAlpha = 1;

    drawTitle(58);
    text("Кооперативное приключение для двух героев", VW / 2, 98, 15, "#d8c8a8", "center", FT, false, 3);

    for (var i = 0; i < 2; i++) {
      var s = sel[i], C = CLASSES[s.cls], x = i === 0 ? 40 : VW / 2 + 20, y = 122, w = VW / 2 - 60, h = 420, pc = PCOL[i];
      panel(x, y, w, h, s.ready ? "#7dff8a" : pc.C);
      text("ИГРОК " + (i + 1), x + w / 2, y + 22, 18, pc.ui, "center", FH, true, 3);
      text(pads[i] ? "геймпад подключён" : (i === 0 ? "клавиатура: A / D, F — готов" : "клавиатура: ← →, K — готов"), x + w / 2, y + 42, 11, pads[i] ? "#7dff8a" : "#aaa", "center", FT, false);
      var hx = x + w / 2, hy = y + 175;
      var gl = ctx.createRadialGradient(hx, hy - 50, 0, hx, hy - 50, 100); gl.addColorStop(0, "rgba(255,200,120,0.18)"); gl.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = gl; ctx.fillRect(hx - 100, hy - 150, 200, 200);
      ctx.fillStyle = "rgba(0,0,0,0.4)"; ctx.beginPath(); ctx.ellipse(hx, hy, 46, 12, 0, 0, 6.283); ctx.fill();
      var demo = { cls: s.cls, id: i, face: 1, ang: -0.3, moving: !s.ready, walk: T * 8, swingT: 0, swingDur: 0.2, swingA: 0, swingDir: 1, spinT: 0, wl: 1, atkCd: 1, castT: 0, hurtT: 0 };
      if (s.ready) {
        var ph = (T * 1.5) % 1;
        if (C.weapon === "sword" && ph < 0.25) { demo.swingT = 0.2 * (1 - ph / 0.25); demo.swingA = -0.2; }
        else if (C.weapon === "staff" && ph < 0.3) demo.castT = 1;
        else if (C.weapon === "bow") demo.atkCd = ph < 0.3 ? 1 : 0;
      }
      drawHero(demo, hx, hy, 6.5);
      if (!s.ready) {
        var bounce = Math.sin(T * 5) * 3;
        ctx.fillStyle = pc.ui;
        ctx.beginPath(); ctx.moveTo(x + 30 - bounce, hy - 50); ctx.lineTo(x + 46 - bounce, hy - 64); ctx.lineTo(x + 46 - bounce, hy - 36); ctx.fill();
        ctx.beginPath(); ctx.moveTo(x + w - 30 + bounce, hy - 50); ctx.lineTo(x + w - 46 + bounce, hy - 64); ctx.lineTo(x + w - 46 + bounce, hy - 36); ctx.fill();
      }
      text(C.name, x + w / 2, y + 202, 26, "#fff", "center", FH, true, 4);
      for (var d = 0; d < C.desc.length; d++) text(C.desc[d], x + w / 2, y + 228 + d * 17, 13, "#cfc3ad", "center", FT, false);
      var labels = ["Здоровье", "Скорость", "Урон", "Дальность"];
      for (var k = 0; k < 4; k++) {
        var sy = y + 290 + k * 19;
        text(labels[k], x + 40, sy, 12, "#aaa", "left", FT, false);
        for (var b = 0; b < 5; b++) {
          ctx.fillStyle = b < C.stats[k] ? pc.c : "rgba(255,255,255,0.1)";
          ctx.fillRect(x + 140 + b * 30, sy - 5, 26, 10);
        }
      }
      ctx.fillStyle = "rgba(255,255,255,0.06)"; ctx.fillRect(x + 20, y + 368, w - 40, 26);
      abilIcon(s.cls, x + 38, y + 381, 0.7);
      text("X: " + C.abil + " — " + C.abilDesc, x + 54, y + 381, 12, "#ffe9a0", "left", FT, true);
      if (s.ready) text("ГОТОВ!  (B — отмена)", x + w / 2, y + 408, 15, "#7dff8a", "center", FT, true, 3);
      else { ctx.globalAlpha = 0.6 + 0.4 * Math.sin(T * 4); text("◄ ► выбор героя  ·  A — готов", x + w / 2, y + 408, 14, "#fff", "center", FT, true, 3); ctx.globalAlpha = 1; }
    }
    text("A/RT — атака · B — рывок · X — умение · Y — кузня/сундук · правый стик — прицел · Start — пауза", VW / 2, 572, 12, "#bba", "center", FT, false, 3);
    text(pads.length < 2 ? "Подключено геймпадов: " + pads.length + " — нажмите любую кнопку на геймпаде, чтобы браузер его увидел" : "Оба геймпада подключены", VW / 2, 594, 12, pads.length < 2 ? "#ff9a7a" : "#7dff8a", "center", FT, false, 3);
    if (record) text("Рекорд: этаж " + record, VW / 2, 616, 12, "#998", "center", FT, false, 3);
  }

  function overlayScreen(title, color, lines) {
    ctx.fillStyle = "rgba(6,4,12,0.8)"; ctx.fillRect(0, 0, VW, VH);
    text(title, VW / 2, 200, 52, color, "center", FH, true, 6);
    for (var i = 0; i < lines.length; i++) text(lines[i].t, VW / 2, 270 + i * 34, lines[i].s || 18, lines[i].c || "#ddd", "center", FT, !!lines[i].b, 3);
  }

  function render() {
    if (state === "select") drawSelect();
    else {
      drawWorld();
      if (state === "pause") overlayScreen("ПАУЗА", "#fff", [
        { t: "Start / Esc / Enter — продолжить", b: true },
        { t: "Левый стик — ходить · Правый стик — целиться", s: 15 },
        { t: "A/RT — атака · B — рывок (неуязвимость) · X — особое умение", s: 15 },
        { t: "Y — кузня и сундуки · Встаньте рядом с упавшим другом, чтобы поднять его", s: 15 }]);
      if (state === "over") overlayScreen("ГЕРОИ ПАЛИ", "#ff5a64", [
        { t: "Вы дошли до этажа " + floorNum, c: "#fff", s: 24, b: true },
        { t: "Рекорд: этаж " + record, c: "#ffd34d" },
        { t: CLASSES[players[0].cls].name + " ур. " + players[0].lvl + "   ·   " + CLASSES[players[1].cls].name + " ур. " + players[1].lvl },
        { t: "" }, { t: "A / Пробел — к выбору героев", b: true, s: 20 }]);
    }
    if (fade > 0) { ctx.fillStyle = "rgba(0,0,0," + fade + ")"; ctx.fillRect(0, 0, VW, VH); }
  }

  // =====================================================================
  //  ЦИКЛ
  // =====================================================================
  var last = 0;
  function loop(ts) {
    var dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
    pollPads();
    update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
