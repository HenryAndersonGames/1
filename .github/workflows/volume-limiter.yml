name: Build Hard Limiter APK

on:
  push:
    paths:
      - "volume-limiter/**"
      - ".github/workflows/volume-limiter.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: volume-limiter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: HardLimiter-apk
          path: volume-limiter/app/build/outputs/apk/release/*.apk
